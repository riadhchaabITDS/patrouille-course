name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Le SDK Android est déjà installé sur les machines GitHub (variable ANDROID_HOME).
      - name: SDK Android
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Polices des jeux embarquées dans les applis (licence SIL OFL). Si le téléchargement échoue, l'appli utilise les polices du téléphone.
      - name: Polices des jeux
        continue-on-error: true
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/Baloo2.ttf "https://github.com/google/fonts/raw/main/ofl/baloo2/Baloo2%5Bwght%5D.ttf"
          curl -fsSL -o fonts/Nunito.ttf "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf"

      - name: Construire les deux applis
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer les APK
        run: |
          cp android/app/build/outputs/apk/patrouille/release/app-patrouille-release.apk PatrouilleCourse.apk
          cp android/app/build/outputs/apk/parc/release/app-parc-release.apk SortieAuParc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: applis-android
          path: |
            PatrouilleCourse.apk
            SortieAuParc.apk

      # Téléchargement direct depuis le téléphone : .../releases/latest/download/<nom>.apk
      - name: Publier en téléchargement direct
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Applis Android n°${{ github.run_number }}
          make_latest: true
          body: |
            - PatrouilleCourse.apk : La Patrouille qui fait la course
            - SortieAuParc.apk : La sortie au parc
          files: |
            PatrouilleCourse.apk
            SortieAuParc.apk
